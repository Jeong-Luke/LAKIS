name: Publish installer

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Public release tag to create or resume
        required: true
      candidate_ref:
        description: Approved candidate commit/ref containing release approval evidence
        required: true
      rc_run_id:
        description: Prepare private RC workflow run ID containing the exact tested artifact set
        required: true

permissions:
  contents: write
  actions: read

jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_ref }}
          fetch-depth: 0
      - name: Verify release identity
        id: identity
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          if ($env:CANDIDATE_REF -notmatch '^[a-fA-F0-9]{40}$') { throw "Candidate ref must be a full 40-character commit SHA." }
          $sourceVersion = (Get-Content -Raw .\VERSION).Trim()
          if ($version -ne $sourceVersion) { throw "Tag $env:RELEASE_TAG does not match VERSION $sourceVersion" }
          $publishedUrl = "https://raw.githubusercontent.com/Jeong-Luke/LAKIS/main/manifests/update-latest.json?prepublish=" + [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
          $publishedResponse = Invoke-RestMethod -Headers @{ "User-Agent" = "LAKIS-Release-Guard/$version" } -Uri $publishedUrl
          # raw.githubusercontent.com serves the manifest as text/plain, so
          # PowerShell can return the JSON document as a string instead of an
          # object.  Normalize both response forms and strip a possible BOM.
          if ($publishedResponse -is [string]) {
            $published = ($publishedResponse.TrimStart([char]0xFEFF) | ConvertFrom-Json)
          } else {
            $published = $publishedResponse
          }
          if ([version]$version -lt [version]([string]$published.version)) {
            throw "Refusing to overwrite an existing release line: candidate=$version published=$($published.version)"
          }
          $complete = $false
          if ([version]$version -eq [version]([string]$published.version)) {
            $releaseJson = $null
            try { $releaseJson = gh release view $env:RELEASE_TAG --json isDraft 2>$null } catch { $releaseJson = $null }
            if ($releaseJson -and -not (($releaseJson | ConvertFrom-Json).isDraft)) { $complete = $true }
            else { throw "Manifest $version is public, but its matching public GitHub release is missing." }
          }
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "complete=$($complete.ToString().ToLowerInvariant())`n", [System.Text.UTF8Encoding]::new($false))
      - name: Re-verify an already published release
        if: steps.identity.outputs.complete == 'true'
        shell: powershell
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          .\installer\Test-UpdateManifest.ps1 -ExpectedVersion (($env:RELEASE_TAG) -replace '^v', '') -VerifyRemote -Passes 3
      - name: Download exact private RC artifact set
        if: steps.identity.outputs.complete != 'true'
        uses: actions/download-artifact@v4
        with:
          name: lakis-private-rc
          path: dist
          github-token: ${{ github.token }}
          run-id: ${{ inputs.rc_run_id }}
      - name: Verify exact approved private RC artifact
        if: steps.identity.outputs.complete != 'true'
        shell: powershell
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
        run: |
          $releaseVersion = (($env:RELEASE_TAG) -replace '^v', '')
          $dist = Join-Path $env:GITHUB_WORKSPACE "dist"
          $evidence = Join-Path $env:GITHUB_WORKSPACE ("release_approvals\v" + $releaseVersion)
          .\installer\Test-ThreePartyAuditGate.ps1 -Version $releaseVersion
          .\installer\Test-ReleaseRegression.ps1 -ExpectedVersion $releaseVersion
          .\installer\Test-InstallerDataSafety.ps1 -InstallerPath (Join-Path $dist "LAKIS_Setup.exe")
          .\installer\Test-PublicProductBoundary.ps1 -DistDirectory $dist
          .\installer\Test-ReleaseApprovalGate.ps1 -Version $releaseVersion -EvidenceDirectory $evidence -DistDirectory $dist
          $buildRecord = Get-Content -Raw -Encoding UTF8 (Join-Path $dist "private-rc-build.json") | ConvertFrom-Json
          $fpPath = Join-Path $env:RUNNER_TEMP "publish-candidate-fingerprint.json"
          .\installer\New-ReleaseAuditFingerprint.ps1 -OutputPath $fpPath | Out-Null
          $current = Get-Content -Raw -Encoding UTF8 $fpPath | ConvertFrom-Json
          if ([string]$buildRecord.fingerprint_sha256 -ne [string]$current.fingerprint_sha256) { throw "Private RC artifact was built from a different candidate fingerprint." }
          $resolvedCandidate = (git rev-parse $env:CANDIDATE_REF).Trim()
          if ([string]$buildRecord.source_commit -ne $resolvedCandidate) { throw "Private RC artifact was built from a different source commit." }
      - name: Create or restore draft release and upload assets
        if: steps.identity.outputs.complete != 'true'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
        run: |
          $releaseJson = $null
          try { $releaseJson = gh release view $env:RELEASE_TAG --json isDraft 2>$null } catch { $releaseJson = $null }
          if (-not $releaseJson) {
            gh release create $env:RELEASE_TAG --target $env:CANDIDATE_REF --draft --title "LAKIS $env:RELEASE_TAG" --notes-file .\RELEASE_NOTES.md
            if ($LASTEXITCODE -ne 0) { throw "Failed to create draft release $env:RELEASE_TAG" }
          } elseif (-not (($releaseJson | ConvertFrom-Json).isDraft)) {
            # A previous attempt may have stopped after publishing but before
            # advancing the manifest. Return it to draft so a retry cannot
            # leave GitHub latest ahead of the updater manifest.
            gh release edit $env:RELEASE_TAG --draft
            if ($LASTEXITCODE -ne 0) { throw "Failed to restore $env:RELEASE_TAG to draft state" }
          }
          git fetch origin ("refs/tags/" + $env:RELEASE_TAG + ":refs/tags/" + $env:RELEASE_TAG) --force
          if ($LASTEXITCODE -ne 0) { throw "Failed to fetch release tag $env:RELEASE_TAG" }
          $tagCommit = (git rev-list -n 1 $env:RELEASE_TAG).Trim()
          $candidateCommit = (git rev-parse $env:CANDIDATE_REF).Trim()
          if ($tagCommit -ne $candidateCommit) { throw "Release tag does not point to the approved candidate ref." }
          gh release upload $env:RELEASE_TAG ".\dist\LAKIS_Setup.exe#LAKIS_Setup.exe" ".\dist\LAKIS.exe#LAKIS.exe" ".\dist\LAKIS_Patcher.exe#LAKIS_Patcher.exe" ".\dist\LAKIS_Updater.exe#LAKIS_Updater.exe" ".\dist\LAKIS_Desktop.exe#LAKIS_Desktop.exe" ".\dist\LAKIS_Model_Importer.exe#LAKIS_Model_Importer.exe" ".\dist\Uninstall_LAKIS.exe#Uninstall_LAKIS.exe" ".\dist\Microsoft.Web.WebView2.Core.dll#Microsoft.Web.WebView2.Core.dll" ".\dist\Microsoft.Web.WebView2.WinForms.dll#Microsoft.Web.WebView2.WinForms.dll" ".\dist\WebView2Loader.dll#WebView2Loader.dll" ".\dist\release-layout.json#release-layout.json" ".\dist\LAKIS_RepairPack.zip#LAKIS_RepairPack.zip" --clobber
          if ($LASTEXITCODE -ne 0) { throw "Failed to upload one or more release assets" }
      - name: Build and verify update manifest from published bytes
        if: steps.identity.outputs.complete != 'true'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          .\installer\New-UpdateManifest.ps1 -Version $version -DistDirectory (Join-Path $env:GITHUB_WORKSPACE "dist")
          # Every staged byte, including external_ui/app.js, must match the
          # manifest three independent times while the release is still draft.
          .\installer\Test-UpdateManifest.ps1 -ExpectedVersion $version -VerifyRemote -Passes 3 -DraftReleaseTag $env:RELEASE_TAG
          Copy-Item .\manifests\update-latest.json (Join-Path $env:RUNNER_TEMP "update-latest.json") -Force
      - name: Publish the fully verified release
        if: steps.identity.outputs.complete != 'true'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release edit $env:RELEASE_TAG --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw "Failed to publish verified release $env:RELEASE_TAG" }
      - name: Publish only the verified manifest
        if: steps.identity.outputs.complete != 'true'
        shell: powershell
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          git restore .\manifests\update-latest.json
          git fetch origin main
          git checkout -B main origin/main
          Copy-Item (Join-Path $env:RUNNER_TEMP "update-latest.json") .\manifests\update-latest.json -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .\manifests\update-latest.json
          if (git diff --cached --quiet) { Write-Output "Manifest is already current"; exit 0 }
          git commit -m "release: publish verified $env:RELEASE_TAG update manifest"
          git push origin main
